server:
  port: 8080

spring:
  application:
    name: cab-booking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cab_booking_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000
  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_mock_stripe_key_cab_booking_enterprise_platform_sec}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_stripe_webhook_cab_booking_signature}
