version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres-db:
    image: postgres:16-alpine
    container_name: cab_booking_postgres
    restart: always
    environment:
      POSTGRES_DB: cab_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cab_booking_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cab_booking_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. Spring Boot Application (Unified Backend & Frontend)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cab_booking_backend
    restart: always
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: cab_booking_db
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      STRIPE_API_KEY: sk_test_mock_stripe_key_cab_booking_enterprise_platform_sec

volumes:
  postgres_data:
